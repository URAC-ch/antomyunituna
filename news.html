<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>URAC — Unité de Recherche en Anatomie Clinique</title>
        <meta name="description" content="Actualités et événements de l'URAC." />
        <meta name="theme-color" content="#032a52" />
        <meta property="og:title" content="URAC — Unité de Recherche en Anatomie Clinique" />
        <meta property="og:description" content="Actualités et événements de l'URAC." />
        <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="assets/css/style.css" />
        <script>
            (function () {
                var theme = 'light';
                try {
                    var s = localStorage.getItem('urac_theme');
                    if (s === 'dark' || s === 'light') theme = s;
                    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
                } catch (e) {}
                document.documentElement.dataset.theme = theme;
            })();
        </script>
    </head>
    <body class="is-loading" data-page="news" data-title="news.title">
        <div id="site-header"></div>

        <main id="main" class="page">
            <div class="page-header">
                <div class="container">
                    <p class="eyebrow" data-i18n="news.eyebrow"></p>
                    <h1 class="page-header__title" data-i18n="news.pageTitle"></h1>
                    <p class="page-header__lead" data-i18n="news.lead"></p>
                </div>
            </div>
            <div class="container">
                <section class="section split split--top" style="--split: 1.5fr 1fr">
                    <ol class="timeline">
                        <li class="timeline__item reveal">
                            <span class="tag" data-i18n="news.n1.date"></span>
                            <h3 style="margin-top:var(--space-3)" data-i18n="news.n1.title"></h3>
                            <p data-i18n="news.n1.text"></p>
                        </li>
                    </ol>
                    <aside class="surface reveal">
                        <h2 class="section__title" style="font-size:var(--text-lg)" data-i18n="news.categoriesTitle"></h2>
                        <ul class="checklist">
                            <li data-i18n="news.c1"></li>
                            <li data-i18n="news.c2"></li>
                            <li data-i18n="news.c3"></li>
                            <li data-i18n="news.c4"></li>
                        </ul>
                    </aside>
                </section>
            </div>
        </main>

        <div id="site-footer"></div>

        <script src="assets/js/config.js"></script>
        <script src="assets/js/i18n.js"></script>
        <script src="assets/js/main.js"></script>
    </body>
</html>
