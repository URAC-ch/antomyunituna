        <link rel="stylesheet" href="assets/css/style.css" />
        <script>
            (function () {
                var theme = 'light';
                try {
                    var s = localStorage.getItem('urac_theme');
                    if (s === 'dark' || s === 'light') theme = s;
                    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
                } catch (e) {}
                document.documentElement.dataset.theme = theme;
            })();
        </script>
    </head>
    <body class="is-loading" data-page="" data-title="notFound.title">
        <div id="site-header"></div>

        <main id="main" class="page">

                <h1 data-i18n="notFound.title"></h1>

                <p style="margin-top:var(--space-6)"><a class="btn" href="index.html" data-i18n="notFound.back"></a></p>
            </section>
        </main>

        <div id="site-footer"></div>

        <script src="assets/js/config.js"></script>
        <script src="assets/js/i18n.js"></script>
