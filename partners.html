<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>URAC — Unité de Recherche en Anatomie Clinique</title>
        <meta name="description" content="Partenaires internationaux de l'URAC : Queen's University, Brigham and Women's Hospital, Université de Las Palmas de Gran Canaria." />
        <meta name="theme-color" content="#032a52" />
        <meta property="og:title" content="URAC — Unité de Recherche en Anatomie Clinique" />
        <meta property="og:description" content="Partenaires internationaux de l'URAC : Queen's University, Brigham and Women's Hospital, Université de Las Palmas de Gran Canaria." />
        <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="assets/css/style.css" />
        <script>
            (function () {
                var theme = 'light';
                try {
                    var s = localStorage.getItem('urac_theme');
                    if (s === 'dark' || s === 'light') theme = s;
                    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
                } catch (e) {}
                document.documentElement.dataset.theme = theme;
            })();
        </script>
    </head>
    <body class="is-loading" data-page="partners" data-title="partners.title">
        <div id="site-header"></div>

        <main id="main" class="page">
            <div class="page-header">
                <div class="container">
                    <p class="eyebrow" data-i18n="partners.eyebrow"></p>
                    <h1 class="page-header__title" data-i18n="partners.pageTitle"></h1>
                    <p class="page-header__lead" data-i18n="partners.lead"></p>
                </div>
            </div>
            <div class="container">
                <section class="section">
                    <div class="grid" style="--col-min: 17rem">
                        <article class="card reveal">
                            <span class="partner__flag" aria-hidden="true">🇨🇦</span>
                            <span class="tag" data-i18n="partners.p1.country"></span>
                            <h2 class="card__title" data-i18n="partners.p1.name"></h2>
                            <p class="card__text" data-i18n="partners.p1.text"></p>
                        </article>
                        <article class="card reveal">
                            <span class="partner__flag" aria-hidden="true">🇺🇸</span>
                            <span class="tag" data-i18n="partners.p2.country"></span>
                            <h2 class="card__title" data-i18n="partners.p2.name"></h2>
                            <p class="card__text" data-i18n="partners.p2.text"></p>
                        </article>
                        <article class="card reveal">
                            <span class="partner__flag" aria-hidden="true">🇪🇸</span>
                            <span class="tag" data-i18n="partners.p3.country"></span>
                            <h2 class="card__title" data-i18n="partners.p3.name"></h2>
                            <p class="card__text" data-i18n="partners.p3.text"></p>
                        </article>
                    </div>
                </section>

                <section class="section split split--top" style="--split: 1.3fr 1fr">
                    <div class="surface reveal">
                        <span class="card__icon" data-icon="handshake"></span>
                        <h2 class="section__title" style="margin-top:var(--space-4)" data-i18n="partners.impactTitle"></h2>
                        <p data-i18n="partners.impact"></p>
                    </div>
                    <div class="surface reveal">
                        <span class="card__icon" data-icon="ultrasound"></span>
                        <h2 class="section__title" style="margin-top:var(--space-4)" data-i18n="partners.funding"></h2>
                        <p data-i18n="partners.fundingText"></p>
                    </div>
                </section>
            </div>
        </main>

        <div id="site-footer"></div>

        <script src="assets/js/config.js"></script>
        <script src="assets/js/i18n.js"></script>
        <script src="assets/js/main.js"></script>
    </body>
</html>
