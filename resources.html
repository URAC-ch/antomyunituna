<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>URAC — Unité de Recherche en Anatomie Clinique</title>
        <meta name="description" content="Ressources, outils et liens utiles de l'URAC." />
        <meta name="theme-color" content="#032a52" />
        <meta property="og:title" content="URAC — Unité de Recherche en Anatomie Clinique" />
        <meta property="og:description" content="Ressources, outils et liens utiles de l'URAC." />
        <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="assets/css/style.css" />
        <script>
            (function () {
                var theme = 'light';
                try {
                    var s = localStorage.getItem('urac_theme');
                    if (s === 'dark' || s === 'light') theme = s;
                    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
                } catch (e) {}
                document.documentElement.dataset.theme = theme;
            })();
        </script>
    </head>
    <body class="is-loading" data-page="resources" data-title="resources.title">
        <div id="site-header"></div>

        <main id="main" class="page">
            <div class="page-header">
                <div class="container">
                    <p class="eyebrow" data-i18n="resources.eyebrow"></p>
                    <h1 class="page-header__title" data-i18n="resources.pageTitle"></h1>
                    <p class="page-header__lead" data-i18n="resources.lead"></p>
                </div>
            </div>
            <div class="container">
                <section class="section">
                    <div class="grid" style="--col-min: 15rem">
                        <article class="card reveal">
                            <span class="card__icon" data-icon="file"></span>
                            <h2 class="card__title" data-i18n="resources.r1.title"></h2>
                            <p class="card__text" data-i18n="resources.r1.text"></p>
                        </article>
                        <article class="card reveal">
                            <span class="card__icon" data-icon="book"></span>
                            <h2 class="card__title" data-i18n="resources.r2.title"></h2>
                            <p class="card__text" data-i18n="resources.r2.text"></p>
                        </article>
                        <a class="card reveal" data-link="slicer">
                            <span class="card__icon" data-icon="cube"></span>
                            <h2 class="card__title" data-i18n="resources.r3.title"></h2>
                            <p class="card__text" data-i18n="resources.r3.text"></p>
                        </a>
                        <a class="card reveal" data-link="openAnatomy">
                            <span class="card__icon" data-icon="scan"></span>
                            <h2 class="card__title" data-i18n="resources.r4.title"></h2>
                            <p class="card__text" data-i18n="resources.r4.text"></p>
                        </a>
                    </div>
                </section>
                <section class="section">
                    <div class="section__head">
                        <h2 class="section__title" data-i18n="resources.instTitle"></h2>
                    </div>
                    <div class="grid" style="--col-min: 18rem">
                        <a class="card reveal" data-link="university" style="flex-direction:row;align-items:center">
                            <span class="card__icon" data-icon="building"></span>
                            <span class="card__title" style="font-size:var(--text-base)" data-i18n="resources.i1"></span>
                        </a>
                        <a class="card reveal" data-link="fmpos" style="flex-direction:row;align-items:center">
                            <span class="card__icon" data-icon="building"></span>
                            <span class="card__title" style="font-size:var(--text-base)" data-i18n="resources.i2"></span>
                        </a>
                        <a class="card reveal" data-link="association" style="flex-direction:row;align-items:center">
                            <span class="card__icon" data-icon="building"></span>
                            <span class="card__title" style="font-size:var(--text-base)" data-i18n="resources.i3"></span>
                        </a>
                    </div>
                </section>
            </div>
        </main>

        <div id="site-footer"></div>

        <script src="assets/js/config.js"></script>
        <script src="assets/js/i18n.js"></script>
        <script src="assets/js/main.js"></script>
    </body>
</html>
