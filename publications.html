<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>URAC — Unité de Recherche en Anatomie Clinique</title>
        <meta name="description" content="Publications scientifiques de l'URAC." />
        <meta name="theme-color" content="#032a52" />
        <meta property="og:title" content="URAC — Unité de Recherche en Anatomie Clinique" />
        <meta property="og:description" content="Publications scientifiques de l'URAC." />
        <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="assets/css/style.css" />
        <script>
            (function () {
                var theme = 'light';
                try {
                    var s = localStorage.getItem('urac_theme');
                    if (s === 'dark' || s === 'light') theme = s;
                    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
                } catch (e) {}
                document.documentElement.dataset.theme = theme;
            })();
        </script>
    </head>
    <body class="is-loading" data-page="publications" data-title="publications.title">
        <div id="site-header"></div>

        <main id="main" class="page">
            <div class="page-header">
                <div class="container">
                    <p class="eyebrow" data-i18n="publications.eyebrow"></p>
                    <h1 class="page-header__title" data-i18n="publications.pageTitle"></h1>
                    <p class="page-header__lead" data-i18n="publications.lead"></p>
                </div>
            </div>
            <div class="container">
                <section class="section">
                    <div data-list="publications"></div>
                </section>
                <section class="section surface reveal">
                    <h2 class="section__title" data-i18n="publications.profiles"></h2>
                    <p class="card__text" data-i18n="publications.profilesText"></p>
                </section>
            </div>
        </main>

        <div id="site-footer"></div>

        <script src="assets/js/config.js"></script>
        <script src="assets/js/i18n.js"></script>
        <script src="assets/js/main.js"></script>
    </body>
</html>
