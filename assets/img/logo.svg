<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="URAC — Clinical Anatomy Research Unit">
  <defs>
    <path id="arc-top" d="M70 256a186 186 0 0 1 372 0"/>
    <path id="arc-bottom" d="M42.6 199.5a222 222 0 1 0 426.8 0"/>
  </defs>

  <!-- Ring -->
  <circle cx="256" cy="256" r="250" fill="#d0242b"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#7d1418" stroke-width="6"/>

  <!-- Disc -->
  <circle cx="256" cy="256" r="168" fill="#1f9a45" stroke="#7d1418" stroke-width="5"/>

  <!-- Ring text -->
  <g fill="#f6d70f">
    <text font-family="'Noto Naskh Arabic', 'Traditional Arabic', Tahoma, 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" text-anchor="middle" direction="rtl">
      <textPath href="#arc-top" startOffset="50%">وحدة أبحاث التشريح السريري</textPath>
    </text>
    <text font-family="'Arial Black', 'Segoe UI Black', Impact, Arial, sans-serif" font-size="35" font-weight="900" letter-spacing="1.5" text-anchor="middle">
      <textPath href="#arc-bottom" startOffset="50%">CLINICAL ANATOMY RESEARCH UNIT</textPath>
    </text>
  </g>

  <!-- Skeleton -->
  <g fill="#f6d70f" stroke="#f6d70f" stroke-linecap="round" stroke-linejoin="round">
    <!-- skull -->
    <ellipse cx="216" cy="127" rx="19" ry="21" stroke="none"/>
    <rect x="205" y="138" width="22" height="14" rx="6" stroke="none"/>
    <!-- neck & clavicles -->
    <path d="M216 152v10" stroke-width="7" fill="none"/>
    <path d="M216 164l-36-3M216 164l36-3" stroke-width="6" fill="none"/>
    <!-- sternum & ribs -->
    <path d="M216 166v58" stroke-width="7" fill="none"/>
    <g fill="none" stroke-width="5.5">
      <path d="M213 172c-14-3-27 1-29 13M219 172c14-3 27 1 29 13"/>
      <path d="M213 183c-15-3-30 1-32 15M219 183c15-3 30 1 32 15"/>
      <path d="M213 194c-15-3-31 1-33 16M219 194c15-3 31 1 33 16"/>
      <path d="M213 205c-14-3-29 1-31 15M219 205c14-3 29 1 31 15"/>
      <path d="M213 216c-12-2-24 1-26 11M219 216c12-2 24 1 26 11"/>
    </g>
    <!-- lumbar spine -->
    <path d="M216 230v32" stroke-width="10" stroke-dasharray="6 3.5" stroke-linecap="butt" fill="none"/>
    <!-- arms -->
    <g fill="none">
      <path d="M180 164l-9 64M252 164l9 64" stroke-width="9"/>
      <path d="M169 233l-7 50M175 233l-3 50M263 233l7 50M257 233l3 50" stroke-width="5"/>
      <path d="M166 288l-6 18M169 289l-2 20M172 289l2 19M175 288l5 16M266 288l6 18M263 289l2 20M260 289l-2 19M257 288l-5 16" stroke-width="3.5"/>
    </g>
    <!-- pelvis -->
    <path d="M216 264c-23-6-36 4-34 20 2 13 17 16 25 10l9 9 9-9c8 6 23 3 25-10 2-16-11-26-34-20z" stroke="none"/>
    <!-- legs -->
    <g fill="none">
      <path d="M198 300l6 56M234 300l-6 56" stroke-width="9"/>
      <circle cx="204" cy="361" r="4.5" fill="#f6d70f" stroke-width="2"/>
      <circle cx="228" cy="361" r="4.5" fill="#f6d70f" stroke-width="2"/>
      <path d="M201 368l-2 40M207 368l0 40M225 368l0 40M231 368l2 40" stroke-width="5"/>
      <path d="M201 410l-12 4M231 410l12 4" stroke-width="7"/>
    </g>
  </g>
  <!-- skeleton details -->
  <g fill="#1f9a45">
    <ellipse cx="209" cy="126" rx="5" ry="5.5"/>
    <ellipse cx="223" cy="126" rx="5" ry="5.5"/>
    <path d="M216 132l-2.5 5h5z"/>
    <path d="M208 145h16" stroke="#1f9a45" stroke-width="1.6"/>
    <ellipse cx="202" cy="288" rx="5" ry="6"/>
    <ellipse cx="230" cy="288" rx="5" ry="6"/>
  </g>

  <!-- Flask -->
  <g transform="translate(330 300) rotate(14)">
    <path d="M-25 14h50l12 25q2 4-3 4h-68q-5 0-3-4z" fill="#f6d70f"/>
    <path d="M-12-50v38l-30 50q-5 9 5 9h74q10 0 5-9l-30-50v-38M-19-50h38" fill="none" stroke="#f6d70f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#1f9a45">
      <circle cx="-12" cy="30" r="4.5"/>
      <circle cx="6" cy="34" r="3.5"/>
      <circle cx="16" cy="24" r="3"/>
      <circle cx="-2" cy="22" r="2.5"/>
    </g>
    <g fill="#f6d70f">
      <circle cx="-4" cy="4" r="3"/>
      <circle cx="5" cy="-6" r="2.2"/>
      <circle cx="-2" cy="-16" r="1.8"/>
    </g>
  </g>
</svg>
