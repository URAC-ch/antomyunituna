<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>URAC — Unité de Recherche en Anatomie Clinique</title>
        <meta name="description" content="Contacter l'Unité de Recherche en Anatomie Clinique (URAC)." />
        <meta name="theme-color" content="#032a52" />
        <meta property="og:title" content="URAC — Unité de Recherche en Anatomie Clinique" />
        <meta property="og:description" content="Contacter l'Unité de Recherche en Anatomie Clinique (URAC)." />
        <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="assets/css/style.css" />
        <script>
            (function () {
                var theme = 'light';
                try {
                    var s = localStorage.getItem('urac_theme');
                    if (s === 'dark' || s === 'light') theme = s;
                    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
                } catch (e) {}
                document.documentElement.dataset.theme = theme;
            })();
        </script>
    </head>
    <body class="is-loading" data-page="contact" data-title="contact.title">
        <div id="site-header"></div>

        <main id="main" class="page">
            <div class="page-header">
                <div class="container">
                    <p class="eyebrow" data-i18n="contact.eyebrow"></p>
                    <h1 class="page-header__title" data-i18n="contact.pageTitle"></h1>
                    <p class="page-header__lead" data-i18n="contact.lead"></p>
                </div>
            </div>
            <div class="container">
                <section class="section split split--top" style="--split: 1fr 1.2fr">
                    <div class="surface reveal">
                        <h2 class="section__title" data-i18n="contact.addressTitle"></h2>
                        <div class="contact-item">
                            <span class="card__icon" data-icon="building"></span>
                            <div>
                                <span class="contact-item__value" data-i18n="contact.unit"></span><br />
                                <span data-i18n="contact.faculty"></span><br />
                                <span data-i18n="contact.university"></span>
                            </div>
                        </div>
                        <div class="contact-item">
                            <span class="card__icon" data-icon="mail"></span>
                            <div>
                                <span class="contact-item__label" data-i18n="contact.email"></span>
                                <span class="contact-item__value" data-config="contact.email" data-config-type="mailto"></span>
                            </div>
                        </div>
                        <div class="contact-item">
                            <span class="card__icon" data-icon="phone"></span>
                            <div>
                                <span class="contact-item__label" data-i18n="contact.phone"></span>
                                <span class="contact-item__value" data-config="contact.phone" data-config-type="tel"></span>
                            </div>
                        </div>
                        <div class="contact-item">
                            <span class="card__icon" data-icon="pin"></span>
                            <div>
                                <span class="contact-item__label" data-i18n="contact.address"></span>
                                <span class="contact-item__value" data-config="contact.address"></span>
                            </div>
                        </div>
                        <div class="contact-item">
                            <span class="card__icon" data-icon="link"></span>
                            <div>
                                <span class="contact-item__label" data-i18n="contact.follow"></span>
                                <div data-list="social"></div>
                            </div>
                        </div>
                    </div>

                    <div class="surface reveal">
                        <h2 class="section__title" data-i18n="contact.formTitle"></h2>
                        <form id="contact-form" class="form">
                            <div class="form__row">
                                <div class="field">
                                    <label for="f-name" data-i18n="contact.name"></label>
                                    <input id="f-name" name="name" type="text" autocomplete="name" required />
                                </div>
                                <div class="field">
                                    <label for="f-email" data-i18n="contact.mail"></label>
                                    <input id="f-email" name="email" type="email" autocomplete="email" required />
                                </div>
                            </div>
                            <div class="field">
                                <label for="f-subject" data-i18n="contact.subject"></label>
                                <input id="f-subject" name="subject" type="text" required />
                            </div>
                            <div class="field">
                                <label for="f-message" data-i18n="contact.message"></label>
                                <textarea id="f-message" name="message" required></textarea>
                            </div>
                            <button class="btn" type="submit"><span data-i18n="contact.send"></span><span data-icon="arrow"></span></button>
                            <p id="form-note" class="form__note" data-i18n="contact.formNote" aria-live="polite"></p>
                        </form>
                    </div>
                </section>
            </div>
        </main>

        <div id="site-footer"></div>

        <script src="assets/js/config.js"></script>
        <script src="assets/js/i18n.js"></script>
        <script src="assets/js/main.js"></script>
    </body>
</html>
